services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    # max_connections : 기본값 100 이면 테스트 스위트가 커넥션 고갈로 깨진다.
    # application-dev.yml 이 측정 재현을 위해 hikari 풀을 50 으로 고정해 뒀는데,
    # 한 JVM 안에 Spring 컨텍스트가 여러 개 캐시되면 50 x N 이 100 을 넘어
    # flyway 초기화가 "FATAL: sorry, too many clients already" 로 실패한다.
    # 풀 50 은 측정 조건이라 건드리지 않고 DB 쪽 상한을 올린다.
    # pg_stat_statements : 병목이 "느린 쿼리" 인지 아닌지를 가르는 유일한 싼 수단이다
    # 없으면 쿼리 지연을 애플리케이션 지표에서 역산해야 하고, 그러면 대기와 실행이 섞인다
    command: >
      postgres -c max_connections=300
               -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    # AOF everysec - 재기동 시 소실 범위를 최대 60초(RDB 기본)에서 최대 1초로 줄인다
    # S2 에서 Redis 는 재고 판정의 유일한 기준이 됐다. DB 조건부 UPDATE 가 뒤에서 초과 발급을
    # 흡수하던 그물을 걷어냈으므로, 재고 키가 사라지면 되돌릴 근거가 함께 사라진다
    # always 를 쓰지 않는 이유는 쓰기마다 fsync 라 발급 경로가 그대로 느려지기 때문이다
    # 소실이 1초치로 줄면 랙 기반 복원이 다뤄야 할 오차의 크기 자체가 작아진다
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:8.0.0
    container_name: kafka
    restart: always
    environment:
      # KRaft : 브로커가 메타데이터를 직접 보관한다 (ZooKeeper 없음, Kafka 4.0 부터 유일한 방식)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      # 저장 폴더 포맷에 쓰는 고정 클러스터 id - 바꾸면 기존 볼륨으로 기동하지 못한다
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - app-network
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - db
      - redis
      - kafka
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - app-network

volumes:
  db_data:
  kafka_kraft_data:

networks:
  app-network:
    driver: bridge