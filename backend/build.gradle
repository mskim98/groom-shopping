plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'groom'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Redisson - 분산 락 (서버 스케일 아웃 시에도 동시성 보장)
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Apache HttpClient 5 - RestTemplate 커넥션 풀 + 단계별 타임아웃 (외부 PG 호출 안정화)
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.apache.kafka:kafka-streams'

    // Resilience4j - 서킷브레이커/재시도 (외부 PG 장애 격리, Cascading Failure 방지)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    // Spring AOP - Resilience4j·@Retryable 어노테이션이 프록시 기반으로 동작하는 데 필요
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // Spring Retry - 낙관적 락 충돌(@Retryable) 자동 재시도
    implementation 'org.springframework.retry:spring-retry'

    // Flyway - DB 마이그레이션 도구
    implementation 'org.flywaydb:flyway-core:8.5.13'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Micrometer Prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // https://mvnrepository.com/artifact/io.awspring.cloud/spring-cloud-aws-starter-s3
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.1'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.2.0'
    testImplementation 'org.mockito:mockito-core:5.2.0'
    // WireMock - 외부 PG(Toss) HTTP 응답을 흉내 내 타임아웃·5xx 등 실패를 주입(②③ 검증)
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트가 전체 Spring 컨텍스트(Kafka Streams·Redisson 등)를 띄우므로 기본 힙(512m)으로는 부족
    maxHeapSize = '1536m'

    // 재고 보정 배치를 테스트 전체에서 끈다.
    // 이 배치는 Redis 재고를 DB 기준 기대값으로 되돌리는데, 통합 테스트는 재고와 DB 를
    // 일부러 어긋나게 두고 게이트를 검증하므로 배치가 겹치면 그 전제가 지워진다.
    //
    // @SpringBootTest(properties=...) 로 클래스마다 끄지 않는 이유 : 프로퍼티가 다르면
    // 컨텍스트 캐시 키가 갈려 Spring 이 컨텍스트를 두 벌 띄운다. 그러면 Kafka 컨슈머도
    // 두 벌이 돼 한쪽 테스트가 발행한 이벤트를 다른 쪽 컨슈머가 실제로 처리한다.
    systemProperty 'coupon.reconcile.enabled', 'false'
}