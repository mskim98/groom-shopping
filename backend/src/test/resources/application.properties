# 시험 전용 커넥션 풀 축소 - 시험 클래스마다 @MockBean 구성이 달라 스프링 컨텍스트가 여러 개 캐시되는데,
# 컨텍스트 하나가 운영값(maximum-pool-size 50, minimum-idle 기본 = 50)만큼 PostgreSQL 연결을 쥐면
# 컨텍스트 3개째에서 max_connections(100)를 넘어 "too many clients already" 로 기동이 실패한다
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
# 캐시된 컨텍스트마다 Kafka Streams 인스턴스가 하나씩 뜨는데 state.dir 이 같으면 두 번째가 잠금 실패로 기동이 깨진다
# (전체 묶음 실행 실측: "Unable to initialize state … same state directory") - 컨텍스트마다 다른 폴더를 준다
spring.kafka.streams.properties.state.dir=${java.io.tmpdir}/groom-kafka-streams-test/${random.uuid}
