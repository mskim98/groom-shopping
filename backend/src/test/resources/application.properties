# 시험 전용 커넥션 풀 축소 - 시험 클래스마다 @MockBean 구성이 달라 스프링 컨텍스트가 여러 개 캐시되는데,
# 컨텍스트 하나가 운영값(maximum-pool-size 50, minimum-idle 기본 = 50)만큼 PostgreSQL 연결을 쥐면
# 컨텍스트 3개째에서 max_connections(100)를 넘어 "too many clients already" 로 기동이 실패한다
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
# Kafka Streams state.dir 격리는 application-dev.properties 에 있다 - 프로필 파일(application-dev.yml)이 이 파일보다 우선해 여기서는 덮이지 않는다
# 쿠폰 스트림 컨슈머 루프는 자동 시작하지 않는다 - 시험이 pollCoupon 을 직접 부르거나 start() 로 켠다
# (루프가 켜져 있으면 같은 Redis 의 다른 시험 쿠폰 스트림을 함께 읽는다)
coupon.issue.stream.enabled=false
# 유휴 인수 시험 · 루프 시험이 몇 초 안에 끝나도록 줄인 값. 운영 기본값은 claim-min-idle-ms 30000, block-ms 1000
coupon.issue.stream.claim-min-idle-ms=200
coupon.issue.stream.block-ms=200
