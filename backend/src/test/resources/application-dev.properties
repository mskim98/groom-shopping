# 캐시된 시험 컨텍스트마다 Kafka Streams 인스턴스가 하나씩 뜨는데 state.dir 이 같으면 두 번째가 잠금 실패로 기동이 깨진다
# (전체 묶음 실행 실측: "Unable to initialize state … same state directory") - 컨텍스트마다 다른 폴더를 준다
# 프로필 전용 .properties 라 같은 위치의 application-dev.yml 보다 우선한다
spring.kafka.streams.properties.state.dir=${java.io.tmpdir}/groom-kafka-streams-test/${random.uuid}
# 결제 승인 후처리 컨슈머와 Outbox 폴러는 시험 컨텍스트에서 끈다 - 캐시된 다른 컨텍스트의 리스너·폴러가 시험이 만든 outbox 행을 먼저 발행·소비해 READY 단언을 깨뜨린다
# 후처리는 컨슈머 메서드를 시험이 직접 부른다. 폴러 첫 회차만 기동 때 한 번 돌고 다음은 1시간 뒤다
payment.consumer.auto-startup=false
payment.outbox.poll-delay-ms=3600000
