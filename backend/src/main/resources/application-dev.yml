spring:
  config:
    activate:
      on-profile: dev

  # bootRun 은 콘솔을 직접 잡지 않아 색이 자동으로 꺼진다 → always 로 강제해 색 출력 유지
  output:
    ansi:
      enabled: always

  # 톰캣이 요청마다 가상 스레드를 쓴다. 플랫폼 스레드 200 개라는 상한이 사라진다
  # 켠 근거 - S0·S1 실측에서 DB 잠금 대기 0 · 최장 쿼리 0.38ms 인데도
  # tomcat.threads.busy 가 200/200 이었다. DB 는 한가한데 받아 줄 스레드가 없던 상태다
  #
  # ⚠ 이것만으로 처리량이 늘지는 않는다. 대기할 수 있는 수가 늘 뿐이고,
  # 커넥션 풀(50)이 상한이면 풀 앞의 줄만 길어져 응답 시간이 오히려 나빠질 수 있다
  # 효과는 게이트에서 거절되는 90% 쪽에서 나오고 확정 경로에는 나오지 않는다
  #
  # 끄고 재려면 SPRING_THREADS_VIRTUAL_ENABLED=false 로 띄운다. 라운드 비교용 손잡이다
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  datasource:
    url: jdbc:postgresql://localhost:5432/shopping_db_dev
    username: dev
    password: dev123
    driver-class-name: org.postgresql.Driver
    hikari:
      # 결제 1건이 중첩 REQUIRES_NEW 로 커넥션 2개를 점유한다.
      # 기본값 10 이면 VU 5 부터 이미 부족해 락 경합 신호가 커넥션 대기에 묻힌다
      # (프리플라이트에서 1,000 회 중 423 회만 완주 · p95 30,550ms).
      # 측정 조건을 소스에 고정해야 docs/measurements/p2 의 수치가 재현된다.
      maximum-pool-size: 50

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      #      cluster settings
      #      cluster:
      #        nodes:
      #          - redis-node-1:6379
      #          - redis-node-2:6379
      #          - redis-node-3:6379
      time-to-live: 3600000   # 3600초 = 60분 TTL
  
  kafka:
    bootstrap-servers: localhost:9092
    # kafka streams setting
    streams:
      application-id: coupon-delay-app
      properties:
        processing.guarantee: exactly_once_v2        # 배포환경에서는 클러스터 최소 3개 필요
        transaction.state.log.replication.factor: 1
        transaction.state.log.min.isr: 1
        commit.interval.ms: 1000
        cache.max.bytes.buffering: 10485760
        num.stream.threads: 1
        # 백엔드 서버 경로 기준
        state.dir: ./tmp/kafka-streams

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway가 스키마 관리
    properties:
      hibernate:
        # show_sql 은 System.out 으로 직접 SQL을 찍어 1초 폴러 때문에 콘솔이 도배된다 → OFF.
        # 쿼리를 봐야 할 때만 show_sql: true 로 켜고, 그때 logback 의 org.hibernate.SQL 도 함께 DEBUG 로 올린다.
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true  # Flyway가 마이그레이션 및 테스트 데이터 관리

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    mbeanregistry:
      enabled: true        # tomcat_threads_* (busy/current/max) 노출 → HTTP 요청 스레드풀 병목 추적
  session:
    cookie:
      secure: false           # HTTP, HTTPS 전송
      http-only: true        # JavaScript 접근 차단
      same-site: lax      # CSRF 방어

