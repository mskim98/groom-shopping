payment:
  toss:
    secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
    api-url: https://api.tosspayments.com
  # 보상 재시도 배치 (PaymentCompensationBatchProperties). 결정 C - 취소는 배치가 유일 경로
  compensation:
    retry-delay-ms: 30000        # 배치 주기. toss-cancel OPEN 45초보다 짧아야 강제 OPEN 뒤 다음 회차가 쉰다
    retry-later-defer-ms: 45000  # 429·403·409 시 다음 시각만 미루는 간격. 주기(30초)보다 길게
    batch-size: 100              # 한 회차 = 한 페이지. 워커 5 x PG 0.3초 / 5 = 6초로 회차 안에 비운다
    workers: 5                   # 페이지를 동시 취소하는 워커 수. 토스 속도 제한 비공개라 보수적(Task 7 답 뒤 조정)
    skip-when-open:              # 회차 시작에 OPEN 이면 쉰다 - toss(승인 회로) · toss-cancel(배치 정지 플래그)
      - toss
      - toss-cancel

# 재고 차감 전략 - pessimistic(기본) | conditional | optimistic. 3자 실측 비교용 스위치
# 2026-08-09 실측으로 기본값을 optimistic 에서 넘겼다 - 근거는 PessimisticLockStockDecrementer 주석
stock:
  decrease-strategy: pessimistic
  reconcile:
    # 스캔 간격. 인플라이트 선점의 최대 수명(Toss 5s x 재시도 3 + 보상)보다 충분히 길게
    interval-ms: 60000
    batch-size: 1000

# 쿠폰 워밍업·재고 보정 배치
coupon:
  issue:
    # 어느 라운드로 뜰지 정하는 값. 기동 시점에 고정된다
    # db-lock(S0) · lua-then-lock(S1) 은 측정 전용이고 kafka(S2) 가 프로덕션 기본값이다
    strategy: ${COUPON_ISSUE_STRATEGY:kafka}
    # 키가 userId 라 한 쿠폰의 이벤트가 파티션 전체에 흩어진다
    # 자동 생성에 맡기면 브로커 기본값(1)로 만들어져 컨슈머가 배정을 못 받고 논다
    # 파티션은 줄일 수 없다(줄이려면 토픽 삭제) - 컨슈머와 1:1 로 맞춘 스윕 결과로 4 를 정했다
    partitions: ${COUPON_ISSUE_PARTITIONS:4}
    # 파티션 수와 같게 둔다 - 파티션당 컨슈머 1개로 배정이 남거나 모자라지 않는다
    #
    # 2026-09-24 실측 - 파티션 = 컨슈머 4 · 8 · 16, 초당 2,000 × 50초, 지점마다 웜업 1 + 3회
    #   확정 지연 p95(접수 -> INSERT, 가장 짧은 회차) 39 · 39 · 52.5 ms - 늘려도 빨라지지 않는다
    #   커넥션 평균 점유 1.75 · 3.43 · 6.95 개 - 컨슈머 수에 비례해 늘고, 풀 50 은 주문 · 결제와 함께 쓴다
    #   INSERT 1,216 · 2,253 · 3,641 회 - 한 번에 받는 양이 줄어 호출당 8.2 · 4.4 · 2.7 행으로 쪼개진다
    #   평균 점유는 hikaricp usage 타이머 합 ÷ 발급 창이다. active 게이지는 1초 캐시라 순간값을 못 본다
    #
    # 2026-09-02 실측 (파티션 4) - 컨슈머를 2 로 줄이면 지표가 더 좋다
    #   초당 2,000: INSERT 호출 1,231 -> 683 회, 호출당 8.1 -> 14.6 행
    #   초당 2,500 각 2회: 못 보낸 요청 (346 · 2,164) -> (0 · 0), 컨슈머 랙 (1,110 · 1,337) -> (175 · 198)
    # 한 번의 poll 이 담는 양은 컨슈머당 도착률이 정하므로, 컨슈머를 줄이면 배치가 커져 왕복이 준다
    # 다만 이 이득은 확정 경로와 접수 경로가 같은 머신을 쓰는 조건에서 나온 것이고,
    # 파티션 수와 어긋나면 배정 규칙을 설명해야 하므로 기본값은 파티션과 같은 4 로 둔다
    consumer-concurrency: ${COUPON_ISSUE_CONCURRENCY:4}
    # 한 번에 받아 한 문장으로 넣는 건수의 상한 (max.poll.records)
    # 초당 2,000 이 파티션 4개로 흩어져 파티션마다 초당 약 500 - 컨슈머가 1초 밀려도 한 번에 받는 크기다
    # 2026-09-24 실측 - 파티션 · 컨슈머 4, 50 · 500 · 2000 각 3회 INSERT 합계(발급 30,000행)
    #   호출당 평균 7.2 · 6.3 · 4.7 행, 최대 50 · 62 · 59 행, 상한에 닿은 호출 3회(0.07%) · 0 · 0
    # 이 값은 목표치가 아니라 상한이다 - 평소 poll 은 그 순간 파티션에 쌓인 몇 행만 가져온다
    # 이 값을 키워서 얻을 것은 없다. 상한은 확정 경로가 아니라 접수 경로에 있다
    batch-size: ${COUPON_ISSUE_BATCH_SIZE:500}
    # 성공 결과까지 결과 토픽에 실을지. 지금 결과 컨슈머는 로그만 남기고 클라이언트는 상태를 폴링한다
    # 켜면 요청 수만큼 메시지가 한 벌 더 돌아 같은 브로커에서 요청 토픽과 경합한다
    publish-success-results: ${COUPON_PUBLISH_SUCCESS_RESULTS:false}
  warmup:
    batch-size: 1000
  reconcile:
    enabled: true
    # 주기 실행을 없앴다. delay-ms 는 더 이상 읽히지 않는다 -
    # 진행 중 이벤트에서는 고아와 처리 중인 요청이 겉으로 같아, 되돌리면 남의 자리를 뺏는다
    # 대조는 종료된 쿠폰에만 적용하고 마감 시 1회 부른다
    batch-size: 500

# 추첨 지연 큐 폴링
raffle:
  drawing:
    # 이 주기가 곧 추첨 실행 지연의 상한. 예약 자체는 Redis 가 들고 있고 여기서는 꺼내기만 하므로
    # 짧게 잡아도 비용은 ZSet 조회 한 번이다 - 분 단위면 추첨 체감상 충분하다
    poll-delay-ms: 60000

# 외부 PG(Toss) HTTP 클라이언트 타임아웃·커넥션 풀 설정 (RestTemplateConfig 에서 주입)
http:
  client:
    toss:
      connect-timeout: 3s            # TCP 핸드셰이크 한도
      response-timeout: 5s           # 승인 응답 수신 한도 (사용자가 기다리는 요청)
      # 취소 전용 응답 한도. 토스 문서가 장애 시 30초를 권장 - 5초로 자르면 정상 처리 중인 취소를
      # 실패로 오판한다. 호출을 트랜잭션 밖으로 뺀 뒤(PaymentCompensationService)에만 안전한 값 -
      # 안이면 실패 1건이 30 커넥션·초라 풀 50 이 초당 1.7건에 마른다
      cancel-response-timeout: 30s
      connection-request-timeout: 2s # 풀에서 커넥션 획득 대기 한도
      max-total: 50                  # 풀 전체 최대 커넥션
      max-per-route: 20              # 목적지당 최대 커넥션

# Resilience4j - 외부 PG(Toss) 호출 서킷브레이커·재시도 (인스턴스명 toss)
resilience4j:
  circuitbreaker:
    instances:
      toss:
        sliding-window-type: COUNT_BASED          # 최근 N건 기준으로 실패율 집계
        sliding-window-size: 20                    # 최근 20건
        minimum-number-of-calls: 10                # 최소 10건은 모여야 회로 판단 (초반 노이즈 방지)
        failure-rate-threshold: 50                 # 실패율 50% 초과 시 OPEN
        slow-call-duration-threshold: 2s           # 2s 초과 호출은 '느린 호출'로 집계
        slow-call-rate-threshold: 80               # 느린 호출 80% 초과 시 OPEN
        wait-duration-in-open-state: 30s           # OPEN 유지 시간 (이후 HALF_OPEN)
        permitted-number-of-calls-in-half-open-state: 5   # HALF_OPEN 에서 탐색 허용 호출 수
        automatic-transition-from-open-to-half-open-enabled: true
      # 취소 전용 회로. 승인(toss)과 분리한다 -
      # 같은 회로면 취소 실패가 승인을 막고, 승인 장애가 보상 취소를 fast-fail 시켜 채무가 쌓인다
      toss-cancel:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        # 배치 주기(payment.compensation.retry-delay-ms 30초)보다 길게 - 배치가 회차 끝에 carried > 0 으로
        # 강제 OPEN 하면 OPEN 타이머와 fixedDelay 가 같은 시각에 출발하므로, 같으면 다음 회차가 OPEN 을
        # 볼지 HALF_OPEN 을 볼지 밀리초 차이로 갈린다 (2026-09-07 실측 강제 OPEN 9회 중 쉼 2회)
        # 45초면 다음 회차(+30초)는 반드시 OPEN 을 보고 쉬고, 그다음 회차(+60초)는 HALF_OPEN 을 본다
        # 대가 - 수동 취소 엔드포인트의 차단 시간도 45초로 늘어난다 (TossCancelOpenDurationTest)
        wait-duration-in-open-state: 45s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        # 이 둘은 토스가 살아 있다는 신호(429·403·409)와 목적 달성(이미 취소)이라
        # 회로 실패율에 넣지 않는다 - 넣으면 정상 응답인데도 회로가 OPEN 으로 오판한다
        # fallback 안에서 재차 걸러내 재시도-스킵과 분리하는 것과는 별개 방어선이다
        ignore-exceptions:
          - groom.backend.infrastructure.payment.TossRetryLaterException
          - groom.backend.infrastructure.payment.TossAlreadyCanceledException
  retry:
    instances:
      toss:
        max-attempts: 3                            # 최초 1회 + 재시도 2회
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          # 회로가 OPEN 이면 재시도해도 즉시 막히므로 재시도 대상에서 제외
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        # env 는 측정 스크립트가 "지금 어느 전략으로 떠 있는가"를 확인하는 데 쓴다
        # 이 확인이 없으면 db-lock 으로 띄워 두고 결과 파일에는 kafka 라고 적는 사고를 막을 수단이 없다
        include: prometheus,health,info,env
      base-path: /actuator  # Actuator 기본 경로
  endpoint:
    env:
      # 환경변수에서 온 값은 기본적으로 ****** 로 가려진다
      # 그러면 측정 스크립트가 "지금 어느 전략인가"를 확인할 수 없어 확인 자체가 무의미해진다
      # dev 프로파일 전용 설정이다
      show-values: ALWAYS
    health:
      show-details: when-authorized  # 권한이 있을 때만 상세 정보 표시
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # HTTP 요청 히스토그램 활성화
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s  # SLO 설정 (백분위수 계산용)

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /**

logging:
  level:
    root: INFO
    groom.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 10

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: goorm-shopping-s3
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
