payment:
  toss:
    secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
    api-url: https://api.tosspayments.com

# 재고 차감 전략 - optimistic(기본) | conditional | pessimistic. 3자 실측 비교용 스위치
stock:
  decrease-strategy: optimistic

# 쿠폰 워밍업·재고 보정 배치
coupon:
  warmup:
    batch-size: 1000
  reconcile:
    enabled: true
    # 보정 주기. 짧게 잡을 이유가 없다 - 게이트 좁아짐은 누적형이라 분 단위로 충분하다
    delay-ms: 60000
    batch-size: 500

# 외부 PG(Toss) HTTP 클라이언트 타임아웃·커넥션 풀 설정 (RestTemplateConfig 에서 주입)
http:
  client:
    toss:
      connect-timeout: 3s            # TCP 핸드셰이크 한도
      response-timeout: 5s           # 응답 수신 한도
      connection-request-timeout: 2s # 풀에서 커넥션 획득 대기 한도
      max-total: 50                  # 풀 전체 최대 커넥션
      max-per-route: 20              # 목적지당 최대 커넥션

# Resilience4j - 외부 PG(Toss) 호출 서킷브레이커·재시도 (인스턴스명 toss)
resilience4j:
  circuitbreaker:
    instances:
      toss:
        sliding-window-type: COUNT_BASED          # 최근 N건 기준으로 실패율 집계
        sliding-window-size: 20                    # 최근 20건
        minimum-number-of-calls: 10                # 최소 10건은 모여야 회로 판단 (초반 노이즈 방지)
        failure-rate-threshold: 50                 # 실패율 50% 초과 시 OPEN
        slow-call-duration-threshold: 2s           # 2s 초과 호출은 '느린 호출'로 집계
        slow-call-rate-threshold: 80               # 느린 호출 80% 초과 시 OPEN
        wait-duration-in-open-state: 30s           # OPEN 유지 시간 (이후 HALF_OPEN)
        permitted-number-of-calls-in-half-open-state: 5   # HALF_OPEN 에서 탐색 허용 호출 수
        automatic-transition-from-open-to-half-open-enabled: true
      # 취소 전용 회로. 승인(toss)과 분리한다 -
      # 같은 회로면 취소 실패가 승인을 막고, 승인 장애가 보상 취소를 fast-fail 시켜 채무가 쌓인다
      toss-cancel:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s   # 보상 첫 백오프 2분보다 짧게 유지 -> 2회차가 실질 첫 시도
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      toss:
        max-attempts: 3                            # 최초 1회 + 재시도 2회
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          # 회로가 OPEN 이면 재시도해도 즉시 막히므로 재시도 대상에서 제외
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info  # Prometheus, Health, Info 엔드포인트 활성화
      base-path: /actuator  # Actuator 기본 경로
  endpoint:
    health:
      show-details: when-authorized  # 권한이 있을 때만 상세 정보 표시
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # HTTP 요청 히스토그램 활성화
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s  # SLO 설정 (백분위수 계산용)

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /**

logging:
  level:
    root: INFO
    groom.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 10

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: goorm-shopping-s3
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
