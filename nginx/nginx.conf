events {}

http {
  # 백엔드 3대 - ip_hash 는 같은 접속 주소를 같은 인스턴스로 보내 인스턴스별 L1 캐시를 따뜻하게 둘 뿐이다
  # 정확성은 고정 배정에 기대지 않는다(한 대가 죽으면 그 주소는 다른 대로 간다)
  upstream backend {
    ip_hash;
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
  }

  # 접속 주소별 초당 30건. 버스트 60건은 즉시 통과시키고 그 이상은 429 로 돌려보낸다
  # 근거: 화면 하나가 API 를 10~20건 동시에 부르므로 버스트 60 이면 화면 3개를 한꺼번에 열어도 막히지 않고,
  #       초당 30건 지속은 사람 손으로는 나오지 않는 값이라 반복 호출 스크립트만 429 를 본다(클라이언트가 보는 것은 상태 429 와 nginx 기본 오류 페이지)
  # 한계: 사내망 · 공유기 뒤의 사용자는 주소 하나를 나눠 쓰므로 한 주소의 합계가 넘으면 함께 429 를 받는다
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_req_status 429;

  server {
    listen 80;

    # Frontend (Next.js)
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 알림 스트림(SSE) - 응답을 모아 보내면 이벤트가 늦게 닿으므로 버퍼링을 끄고,
    # 연결이 한 시간 열려 있을 수 있어 읽기 제한을 길게 둔다. URI 를 그대로 넘기려고 proxy_pass 에 경로를 쓰지 않는다
    location = /api/v1/notification/stream {
      limit_req zone=api_per_ip burst=60 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (Spring Boot)
    # 읽기 제한 70초: Toss 승인 응답 한도가 60초라 이보다 짧으면 결제가 승인된 뒤에 504 가 나간다
    # X-Forwarded-For 를 $remote_addr 로 덮어쓴다 - 클라이언트가 보낸 값을 이어 붙이면 로그인 주소 기록을 위조할 수 있다
    location /api/v1/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      proxy_pass http://backend/api/v1/;
      proxy_read_timeout 70s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
