# 부하 측정용 덧씌우기 - 사용: env.sh 의 $DC (docker compose -p r119-measure -f docker-compose.yml -f 이 파일 -f k6/loadtest/.generated/compose.servers<SERVERS>.yml)
# nginx 의 설정 마운트와 depends_on 은 SERVERS 대수에 맞춰 env.sh 가 .generated/ 에 만든다 - 이 파일에는 두지 않는다
# 상대 경로는 첫 파일(docker-compose.yml)의 폴더 기준이다
x-loadtest-env: &loadtest-env
  # 시드 DB 하나만 바꾼다 - 이름이 shop_seed 로 시작하는 DB (run.sh seed 가 만든다)
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shop_seed_m1
  PAYMENT_TOSS_API_URL: http://wiremock:8080
  # 힙 상한 1.5 GB - 상한이 없으면 컨테이너 3개가 Docker 메모리 12.5 GB 를 힙 기본값(전체의 1/4)으로 나눠 가져 단계마다 GC 크기가 달라진다
  JAVA_TOOL_OPTIONS: "-Xmx1536m"
  # dev 프로파일은 groom.backend 와 org.springframework.web 을 DEBUG 로 콘솔 · 파일에 요청마다 쓴다 - 초당 수천 요청에서는 로그 쓰기가 측정 대상이 되므로 INFO 로 올린다
  LOGGING_LEVEL_GROOM_BACKEND: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
  SPRING_OUTPUT_ANSI_ENABLED: never
  # 진단용 - 커넥션을 쥔 시간이 문턱값(ms)을 넘은 스레드의 빌린 시점 스택을 로그에 남긴다(r120 Hikari 고갈 추적). 기본 0 = 끔(최종 측정은 끈 채로 잰다), 켜려면 호스트 환경 변수 LEAK_DETECTION_MS=2000
  SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD: ${LEAK_DETECTION_MS:-0}
  # 요청 스레드를 가상(기본) 대신 플랫폼 스레드로 바꾸는 손잡이 - 가상 스레드는 SIGQUIT 스레드 덤프에 나오지 않는다. 호스트 환경 변수 SPRING_THREADS_VIRTUAL_ENABLED=false 로 켠다
  SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-true}
  # 서버당 Hikari 풀 크기 - 기본 50 은 루트 compose 의 값 그대로이고, 풀 크기 비교 측정(호스트 환경 변수 HIKARI_POOL=25)에만 바꾼다
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_POOL:-50}
  # 쿠폰 발급 방식 - stream(기본) | db-lock. 기동 때 고정되므로 호스트 환경 변수 COUPON_ISSUE_STRATEGY=db-lock 으로 스택을 다시 띄워야 바뀐다(r129)
  COUPON_ISSUE_STRATEGY: ${COUPON_ISSUE_STRATEGY:-stream}
  # 측정 전용 인증 우회(헤더 X-Lt-User-Id 를 믿는다) - 기본 false. Redis 를 멈추는 실행에서 JWT 블랙리스트 조회(Redis)를 빼려고 켠다(r129, Ruling R129-5)
  LOADTEST_AUTH_BYPASS_ENABLED: ${LOADTEST_AUTH_BYPASS_ENABLED:-false}
  # 토큰 저장소 Redis 호스트(r131) - 기본 redis-token(주 Redis 와 다른 컨테이너). 주 Redis 를 멈추는 실행에서 인증이 살아 있으려면 둘이 달라야 한다
  TOKEN_REDIS_HOST: ${TOKEN_REDIS_HOST:-redis-token}
  # 결제 후처리 컨슈머 스레드 수와 payment-events 파티션 수(r131) - 기본 2 · 2. 토픽은 백엔드가 뜰 때 이 값으로 만들어지므로(seed 가 토픽을 지운다) 둘은 같은 환경 변수 하나에서 온다
  PAYMENT_CONSUMER_CONCURRENCY: ${PAYMENT_CONSUMER_CONCURRENCY:-2}
  PAYMENT_EVENTS_PARTITIONS: ${PAYMENT_EVENTS_PARTITIONS:-2}

services:
  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: wiremock
    # 기본 컨테이너 스레드(25)로는 백엔드 3대의 Toss 호출 동시 150 건을 받지 못해 PG 쪽 지연이 측정에 섞인다
    command: ["--global-response-templating", "--container-threads", "200"]
    ports:
      - "18089:8080"
    volumes:
      - ./k6/wiremock/healthy:/home/wiremock:ro
    networks:
      - app-network

  backend1:
    environment: *loadtest-env
  backend2:
    environment: *loadtest-env
  backend3:
    environment: *loadtest-env
