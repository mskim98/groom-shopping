# 부하 측정 전용 nginx 설정 - 보호용 nginx.conf(주소별 초당 30건 제한 + ip_hash)는 단일 호스트 k6 가 모든 요청을 429 와 한 대로 받게 하므로 측정에 쓰지 않는다
# 이 파일은 라운드 로빈 + 제한 없음이다. 보호 설정의 효과는 이 측정에 들어 있지 않다
# 세 대 기준 원본이다 - 스택은 env.sh 가 SERVERS 대수에 맞춰 upstream 줄을 지워 만든 k6/loadtest/.generated/nginx.loadtest.<SERVERS>.conf 를 마운트한다
worker_processes auto;

events {
  # 초당 6,000 요청을 받으면 클라이언트 쪽 연결과 백엔드 쪽 연결이 함께 열려 있다 - 작업자당 값이 작으면 "worker_connections are not enough" 로 요청이 끊긴다
  worker_connections 16384;
}

http {
  # 라운드 로빈(기본). keepalive 가 없으면 요청마다 백엔드와 TCP 연결을 새로 맺어 nginx 쪽 임시 포트가 TIME_WAIT 로 쌓이고 연결 수립에 CPU 를 쓴다
  upstream backend {
    server backend1:8080;
    server backend2:8080;
    keepalive 256;
  }

  # 수집기가 단계마다 줄 번호로 잘라 읽는다. $upstream_addr 로 백엔드별 요청 수를, $request_time 으로 nginx 가 본 응답 시간을 센다
  log_format loadtest '$time_iso8601 $request_method $uri $status $request_time $upstream_addr $upstream_response_time';
  access_log /var/log/nginx/loadtest.access.log loadtest buffer=64k flush=1s;

  server {
    listen 80;

    # /api/ 아래 모두를 요청 경로 그대로 백엔드로 넘긴다 (요청 수 제한 없음) - 업무 API(/api/v1/)와 /api/actuator/ 가 한 설정으로 닿는다
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 70s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
